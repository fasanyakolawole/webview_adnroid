

<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta http-equiv="X-UA-Compatible" content="IE=edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" href="favicon.ico"/><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/><title>Naija Meals — Driver</title><script defer="defer" src="js/chunk-vendors.15b84a45.js"></script><script defer="defer" src="js/app.ea769e51.js"></script><link href="css/app.4d1cc834.css" rel="stylesheet"></head><body><noscript>This app requires JavaScript.</noscript><div id="app"></div></body></html>


<script>
    function yourJsFunction() {
        const token = localStorage.getItem("@driver_token");
        console.log("TOKEN:", token);

        const myHeaders = new Headers();
        myHeaders.append("Authorization", "Bearer " + token);
        myHeaders.append("Accept", "application/json");
        myHeaders.append("Content-Type", "application/json");

        if (!navigator.geolocation) {
            alert("Geolocation is not supported by this browser.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const raw = JSON.stringify({
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                });

                fetch("https://api.naijameals.com/api/driver/location", {
                    method: "PUT",
                    headers: myHeaders,
                    body: raw
                })
                .then(async res => {
                    const text = await res.text();
                    console.log("STATUS:", res.status);
                    console.log("RESPONSE:", text);
                    alert(text);
                })
                .catch(error => {
                    console.error(error);
                    alert("Fetch error: " + error);
                });
            },
            (error) => {
                console.error(error);
                alert("Error getting location: " + error.message);
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }
</script>
